# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Linked to "AVA Pay" (Agentic Verification Architecture LLC) 2026-08-09.
# Webhooks, compliance topics, and app proxy merged from the original
# shopify.app.toml, which is now superseded by this file.

client_id = "a11383a35e184d1ca38fb0d1c7116a68"
name = "AVA Pay"
application_url = "https://example.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# read_orders, write_discounts: create one-time discount codes for verified agents
# write_checkouts: read checkout data via webhook for telemetry
scopes = "read_customers,read_orders,write_checkouts,write_discounts"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
# Pinned to match the app code's ApiVersion (January 2026, per the RR7 migration).
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "checkouts/create" ]
uri = "/webhooks/checkouts/create"

[[webhooks.subscriptions]]
topics = [ "orders/create" ]
uri = "/webhooks/orders/create"

# Mandatory Shopify privacy / compliance webhooks (GDPR/CCPA).
# Required for App Store approval.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/webhooks/shop/redact"

[pos]
embedded = false

# App proxy: storefront JS calls https://{shop}.myshopify.com/apps/ava-pay/...
# and Shopify forwards to our /proxy/... routes (HMAC-signed by Shopify).
[app_proxy]
url = "https://example.com/proxy"
subpath = "ava-pay"
prefix = "apps"
